  itin:[
    {day:"Day 0 · 8/15 Sat",title:"Brooklyn → Saratoga赛马 → Albany过夜",items:[
      {t:"9:00AM",w:"Brooklyn出发",d:"I-87N(左/快路线)。约3-3.5h到Saratoga。提前网上买GA门票(<a href='https://www.nyra.com/saratoga/visit/tickets' target='_blank'>NYRA购票</a>)。带cooler可自带食物+罐装饮料。"},
      {t:"12:30PM",w:"🏇 到达Saratoga Race Course",d:"Gates 11AM已开。First Post 12:35PM。先在Backyard找位置，或走到Paddock看马热身。<a href='https://www.nyra.com/saratoga/' target='_blank'>NYRA Saratoga官网</a> · <a href='https://www.nyra.com/saratoga/calendar/2026/08/' target='_blank'>8月赛程</a>"},
      {t:"1:30PM",w:"看2-3场赛马",d:"每场赛约2分钟，间隔25-30min。可以试下注$2-5/场。Horse Sense(Gate A)12-2PM可摸退役赛马。<a href='https://www.nyra.com/saratoga/visit/' target='_blank'>入场须知+地图</a>"},
      {t:"3:00PM",w:"离开 → Albany",d:"I-87S约30min到Colonie/Latham区酒店。可以顺路逛Saratoga Springs小镇Broadway大街(20min)。<a href='https://www.saratoga.com/things-to-do/' target='_blank'>Saratoga Springs景点</a>"},
      {t:"4:00PM",w:"Albany酒店check-in",d:"Colonie/Latham区(I-87 Exit 5-7)。提前订好：<a href='https://www.ihg.com/holidayinnexpress/hotels/us/en/albany/albxap/hoteldetail' target='_blank'>Holiday Inn Express</a> · <a href='https://www.hilton.com/en/hotels/albwrhx-hampton-albany-wolf-road/' target='_blank'>Hampton Inn</a> · <a href='https://www.redroof.com/property/NY/Albany/RRI004' target='_blank'>Red Roof Inn</a>"},
      {t:"5:30PM",w:"🌆 Empire State Plaza 散步",d:"开车15min到downtown Albany。巨大反射池+现代建筑群+Vietnam Memorial。免费。日落时分拍照绝佳。The Egg（蛋形剧院）外观很酷。夜间灯光倒映水面非常美。📍 Empire State Plaza, Albany。<a href='https://empirestateplaza.ny.gov/' target='_blank'>官网</a>"},
      {t:"7:00PM",w:"🍽️ Lark Street 晚餐",d:"Albany最好的餐厅/酒吧街区。Bombers Burrito Bar（大份墨西哥卷）· El Loco（Mexican）· The Hollow Bar+Kitchen（craft beer+music）· Cafe Capriccio（意大利）。步行距离内很多选择。<a href='https://larkstreetbid.org/' target='_blank'>Lark Street BID</a>"},
      {t:"",w:"⚠️ 提醒",d:"明天要9:30AM到Bennington。Albany→Bennington 35min。8:30AM出发即可。⚠️ Capitol/Museum/Corning Tower都是周一至五才开，周六看不了→留给周二回程！"}
    ]},
    {day:"Day 1 · 8/16 Sun",title:"Bennington Battle Day → Manchester Kimpton",items:[
      {t:"7:30AM",w:"酒店早餐+退房",d:"免费含早餐。吃饱出发。"},
      {t:"8:30AM",w:"开车去Bennington",d:"Route 7 East。35分钟。目标9:15到，找停车位。Battle Day人多建议9:30前到。<a href='https://benningtonvt.org/community/battle_day.php' target='_blank'>Battle Day 2026完整日程</a>"},
      {t:"9:30AM",w:"纪念碑免费登顶",d:"Battle Day全天免费入场！306ft电梯登顶看三州。平时$8/人。<a href='https://historicsites.vermont.gov/bennington-monument' target='_blank'>VT State Historic Sites</a> · <a href='https://www.benningtonbattlemonument.com/' target='_blank'>纪念碑官网</a>"},
      {t:"10:00AM",w:"🎆 独立战争重演",d:"Living historians火枪+大炮演示。⚠️周日只有10AM-Noon（2小时）。<a href='https://historicsites.vermont.gov/event/bennington-battle-day-3' target='_blank'>VT Historic Sites 2026活动</a>"},
      {t:"12:30PM",w:"⭐ Battle Day大游行",d:"VT最大游行！花车+消防车，1英里约1小时。站在四角路口(Main/Route 7)看最佳。<a href='https://benningtonvt.org/community/battle_day.php' target='_blank'>Bennington Town官网</a>"},
      {t:"1:30PM",w:"午餐 + 出发",d:"⚠️ Food truck festival是周六，周日不确定有。Blue Benn Diner是稳妥选择（📍314 North St · 📞802-442-5140）。<a href='https://www.bluebenn.com/' target='_blank'>bluebenn.com</a> · <a href='https://www.tripadvisor.com/Restaurant_Review-g57183-d517944-Reviews-Blue_Benn_Diner-Bennington_Vermont.html' target='_blank'>Tripadvisor #1 Bennington</a>"},
      {t:"2:00PM",w:"Sugar Shack",d:"Route 7A路上经过。Maple creemee $5-7。枫糖手信。5分钟停靠。<a href='https://www.tripadvisor.com/Attraction_Review-g30217-d5773270-Reviews-Sugar_Shack-Arlington_Vermont.html' target='_blank'>Tripadvisor</a>"},
      {t:"2:30PM",w:"直奔酒店（Hildene留给明天）",d:"💡 Hildene周日开但时间不够且resort fee门票要先check-in。<strong>Hildene放周一上午。</strong> <a href='https://hildene.org/visit/' target='_blank'>Hildene参观信息</a>"},
      {t:"3:00PM",w:"Kimpton Check-in",d:"官方4PM但提前到可寄存行李+领Hildene免费门票(明天用，<a href='https://www.taconichotel.com/events/hildene/' target='_blank'>resort fee含2张成人票</a>)。<a href='https://www.taconichotel.com/' target='_blank'>taconichotel.com</a> · 📞(802)362-0147"},
      {t:"5:00PM",w:"🍷 Manager's Reception",d:"免费红酒+芝士。<a href='https://www.taconichotel.com/manchester-event-venues/experiences/' target='_blank'>酒店活动页</a>"},
      {t:"6:30PM",w:"晚餐",d:"选项1：Copper Grouse 🍷瓶装酒5折！<a href='https://www.opentable.com/copper-grouse-taconic-hotel' target='_blank'>OpenTable预约</a><br>选项2：Hill Farm(4PM起，有羊驼！) <a href='https://www.hillfarminn.com/dine' target='_blank'>hillfarminn.com</a>"},
      {t:"8:30PM",w:"泳池 + 火坑",d:"8月夜间18-20°C。泳池全开。S'mores。完美。"}
    ]},
    {day:"Day 2 · 8/17 Mon",title:"Manchester 全日探索",items:[
      {t:"7:30AM",w:"Up for Breakfast 或 酒店早餐",d:"Up for Breakfast: 8AM前到避排队。Maple Latte必点。<a href='https://www.tripadvisor.com/Restaurant_Review-g57312-d947067-Reviews-Up_for_Breakfast-Manchester_Vermont.html' target='_blank'>Tripadvisor</a>。或<a href='https://www.coppergrouse.com/menus' target='_blank'>Copper Grouse</a>周一早餐8-10:30。"},
      {t:"9:00AM",w:"可选：Renu Lounge SPA",d:"⚠️ 周一只开9AM-1PM！桑拿$45/冷水池$25，TACONIC码8折。<a href='https://www.renulounge.com/packages' target='_blank'>价格与预约</a>"},
      {t:"9:30AM",w:"⭐ Hildene 林肯故居",d:"用check-in时领的免费门票（2张成人票/per stay，含在resort fee里 → <a href='https://www.taconichotel.com/events/hildene/' target='_blank'>Kimpton官网证明</a>）！周一10AM-4:30PM。24室大宅+Lincoln礼帽+Pullman车厢+花园。预留2-3小时。<a href='https://hildene.org/' target='_blank'>hildene.org</a> · <a href='https://hildene.org/visit/' target='_blank'>参观信息</a>"},
      {t:"12:00PM",w:"午餐",d:"<a href='https://www.opentable.com/copper-grouse-taconic-hotel' target='_blank'>Copper Grouse</a>周一有午餐12-2:30！或<a href='https://www.thecrookedram.com/' target='_blank'>Crooked Ram</a> · <a href='https://www.tripadvisor.com/Restaurant_Review-g57312-d23914771-Reviews-Depot_Street_Burgers-Manchester_Vermont.html' target='_blank'>Depot St Burgers</a>"},
      {t:"1:30PM",w:"⛰️ Skyline Drive 登顶",d:"$25/车+$5/人。8月晴天五州景观。最后入场4PM。预留2小时。<a href='https://equinoxmountain.com/' target='_blank'>equinoxmountain.com</a>"},
      {t:"3:30PM",w:"Manchester Hot Glass",d:"周一开！吹杯$75(30min)。需预约📞(802)362-2227。作品次日取。<a href='https://www.manchesterhotglass.com/classes/' target='_blank'>课程与预约</a>"},
      {t:"3:00PM",w:"Northshire Bookstore + 购物",d:"<a href='https://www.northshire.com/' target='_blank'>Northshire</a> + <a href='https://www.manchesterdesigneroutlets.com/' target='_blank'>Manchester Outlets</a>(Vermont Flannel/EPOCH Gallery/Italian Market)。"},
      {t:"4:30PM",w:"可选下午活动",d:"<a href='https://www.bromley.com/' target='_blank'>Bromley Adventure</a>(alpine slide全开!) · <a href='https://www.orvis.com/s/manchester-vermont-flagship-store/store-1007' target='_blank'>Orvis旗舰店</a>(免费) · <a href='https://www.alltrails.com/trail/us/vermont/lye-brook-falls-trail' target='_blank'>Lye Brook Falls</a>(4.5mi/2.5h) · <a href='https://www.equinoxpreservationtrust.org/' target='_blank'>Equinox Preserve</a>散步。"},
      {t:"5:00PM",w:"🍷 Manager's Reception",d:"免费酒会。<a href='https://www.taconichotel.com/' target='_blank'>taconichotel.com</a>"},
      {t:"6:30PM",w:"晚餐",d:"Silver Fork周一休❌。替代：<a href='https://www.thecrookedram.com/' target='_blank'>Crooked Ram</a>(木火披萨) · <a href='https://www.yeoldetavern.net/' target='_blank'>Ye Olde Tavern</a>(1790) · <a href='https://mystico802.com/' target='_blank'>Mystico 802</a>(意大利) · <a href='https://www.opentable.com/copper-grouse-taconic-hotel' target='_blank'>Copper Grouse</a>(🎵live music!)。"},
      {t:"9:00PM",w:"火坑 + 看星星",d:"Manchester夏夜。远离光害，星空好。"}
    ]},

      {t:"9:30AM",w:"可选早上活动",d:"<a href='https://www.svac.org/' target='_blank'>SVAC</a>(周二开$15) · <a href='https://www.orvis.com/s/manchester-vermont-flagship-store/store-1007' target='_blank'>Orvis旗舰店</a>(免费) · <a href='https://www.equinoxpreservationtrust.org/' target='_blank'>Equinox Preserve</a>散步(免费) · 取Hot Glass作品(📞802-362-2227确认)"},
      {t:"11:00AM",w:"Check-out → 开车去Albany",d:"Route 7A S → Route 7 → Albany。约1小时。"},
      {t:"12:00PM",w:"🏛️ NY State Capitol 免费导览",d:"全美最美州议会大厦之一。Million Dollar Staircase必看！免费45min导览周一至五10am/12pm/2pm。无需预约(<10人)。📍 State St, Albany。<a href='https://empirestateplaza.ny.gov/capitol' target='_blank'>官方导览页</a> · <a href='https://empirestateplaza.ny.gov/capitol-walk-tours' target='_blank'>Walk-in Tour详情</a>"},
      {t:"1:00PM",w:"🏛️ NY State Museum",d:"免费！9/11展厅+原住民展+Hudson River生态。45分钟重点。📍 Empire State Plaza内。<a href='https://www.nysm.nysed.gov/' target='_blank'>nysm.nysed.gov</a>"},
      {t:"1:30PM",w:"🔭 Corning Tower 42楼观景台",d:"免费！360度山景+Hudson River。快速上下15min。<a href='https://empirestateplaza.ny.gov/' target='_blank'>Empire State Plaza</a>"},
      {t:"2:00PM",w:"Albany午餐",d:"Plaza Concourse快餐或<a href='https://larkstreetbid.org/' target='_blank'>Lark Street</a>(5min车程)。"},
      {t:"2:30PM",w:"🚗 Albany → Woodbury Common",d:"I-87S约1.5小时。"},
      {t:"4:00PM",w:"🛍️ Woodbury Common Premium Outlets",d:"周二人少！250+品牌。开到8PM。<a href='https://www.premiumoutlets.com/outlet/woodbury-common' target='_blank'>官网</a> · <a href='https://www.simon.com/app' target='_blank'>下载Simon+App领优惠券</a>"},
      {t:"6:30PM",w:"Woodbury出发回Brooklyn",d:"约1小时。I-87S → GW Bridge/Palisades Pkwy → Brooklyn。"},
      {t:"7:30PM",w:"到家！",d:"4天3夜完美收官。🎉"},
      {t:"",w:"🤔 Silver Fork方案（替代Woodbury）",d:"Silver Fork周二5PM开→放弃Woodbury，下午留Manchester。Crab Cake $42+Soufflé $14→7PM出发→约11:30PM到Brooklyn。📞(802)768-8444提前订。<a href='https://www.thesilverforkvt.com/' target='_blank'>thesilverforkvt.com</a>"}
    ]}

    h+=card(cg);
    D.rests.forEach(function(r){
      var inner='<div style="display:flex;justify-content:space-between;align-items:flex-start">'+h3(r.e+' '+r.n)+tag(r.p,'tag-orange')+'</div>';
      inner+='<p style="font-size:.73rem;color:var(--muted);margin-bottom:2px">'+r.t+(r.h?' · '+r.h:'')+(r.ph?' · 📞'+r.ph:'')+'</p>';
      inner+='<p style="font-size:.8rem;color:var(--text2);margin-top:3px;line-height:1.6">'+r.d+'</p>';
      if(r.m){inner+='<div style="margin-top:4px;font-weight:500;font-size:.8rem;margin-bottom:1px">必点：</div>';r.m.forEach(function(m){inner+='<div style="font-size:.77rem;color:var(--text2);line-height:1.4">• '+m+'</div>'})}
      if(r.tp)inner+='<div class="tip-box">💡 '+r.tp+'</div>';
      if(r.l)inner+='<div style="margin-top:3px">'+L(r.l,'→ 官网')+'</div>';
      h+=card(inner);
    });
  }

  else if(cur==='activities'){
    D.acts.forEach(function(a){
      var inner=h3(a.n)+'<div class="exp-price">'+a.p+'</div><p style="font-size:.8rem;color:var(--text2);line-height:1.6">'+a.d+'</p>';
      if(a.l)inner+='<div style="margin-top:3px">'+L(a.l,'→ 详情')+(a.l2?' · '+L(a.l2,'→ 博物馆'):'')+'</div>';
      h+=card(inner);
    });
  }

  else if(cur==='booking'){
    h+=warn('<strong>⚠️ 出发前必须完成：</strong>Albany酒店+Silver Fork电话订位+Copper Grouse OpenTable+Manchester Hot Glass电话约。其他按兴趣选择。每个项目都附了link，点击可直接验证/预约。');

    function bookRow(item){
      var inner='<div style="padding:8px 0;border-bottom:1px solid #f2e7d9">';
      inner+='<div style="font-size:.86rem;font-weight:600;color:var(--text)">'+item.n+'</div>';
      inner+='<div style="font-size:.78rem;color:var(--accent);font-weight:500;margin:2px 0">'+item.how+'</div>';
      inner+='<div style="font-size:.75rem;margin:3px 0">';
      item.links.forEach(function(lk,idx){
        if(idx>0)inner+=' · ';
        inner+=L(lk.u,lk.t);
      });
      inner+='</div>';
      if(item.note)inner+='<div style="font-size:.73rem;color:var(--muted);margin-top:2px">'+item.note+'</div>';
      inner+='</div>';
      return inner;
    }

    var must='';D.booking.mustBook.forEach(function(b){must+=bookRow(b)});
    h+=card(h3('🔴 必须提前预约/订位（不订可能没位）')+must);

    var adv='';D.booking.advanceTix.forEach(function(b){adv+=bookRow(b)});
    h+=card(h3('🟡 建议提前购票（现场也行但可能排队）')+adv);

    var wi='';D.booking.walkIn.forEach(function(b){wi+=bookRow(b)});
    h+=card(h3('✅ Walk-in / 不需要预约（每项都有验证link）')+wi);

    h+=card(h3('📝 出发前Checklist')+'<div style="font-size:.82rem;color:var(--text2);line-height:2">'
      +'☐ Albany酒店已订（确认号：______）<br>'
      +'☐ Kimpton Taconic已确认（确认号：______）<br>'
      +'☐ Saratoga GA门票已买（NYRA）<br>'
      +'☐ Silver Fork 8/18周二已电话订位 📞(802)768-8444<br>'
      +'☐ Copper Grouse 8/16周日+8/17周一已OpenTable订位<br>'
      +'☐ Manchester Hot Glass 8/17周一已电话约 📞(802)362-2227<br>'
      +'☐ Hill Farm 8/16周日已订（如果选这家晚餐）<br>'
      +'☐ Land Rover已约（如果去）📞(802)362-0687<br>'
      +'☐ Google Maps已下载VT离线地图<br>'
      +'☐ EZPass余额已确认<br>'
      +'☐ Simon+App已下载（Woodbury优惠券）<br>'
      +'☐ Cooler/保冷袋已准备（Saratoga+回程芝士枫糖）<br>'
      +'☐ Smart casual一套已打包（Saratoga+Silver Fork）'
      +'</div>');
  }

  else if(cur==='practical'){
    h+=card(h3('🌤️ 八月天气')+'<p class="sub">Manchester 8月高温25-28°C(77-82°F)，夜间15-18°C(59-64°F)。步道干爽。偶有雷阵雨（下午）。日照到8PM。Skyline Drive山顶低5-8°C带薄外套。完美户外季节。</p>');
    var pk='';D.pack.forEach(function(p){pk+='<div style="font-size:.8rem;color:var(--text2);padding:2px 0">☐ '+p+'</div>'});
    h+=card(h3('🎒 装箱清单')+pk);
    var ph='';D.phones.forEach(function(e){ph+='<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #f2e7d9;font-size:.8rem"><span style="color:var(--text2)">'+tag(e.t,(e.t==='紧急'||e.t==='医疗')?'tag-red':'')+' '+e.n+'</span><span style="color:var(--accent);font-weight:600">'+e.p+'</span></div>'});
    h+=card(h3('📞 电话')+ph);
    h+=card(h3('📱 信号')+'<p class="sub">VT南部所有运营商信号差。Route 7A/Lye Brook/山区无信号。<strong>必须提前下载Google Maps离线地图</strong>。Saratoga和Albany信号正常。EZPass确认余额。</p>');
    var lk='<div class="link-grid">';D.links.forEach(function(l){lk+='<div>'+L(l[1],l[0])+'</div>'});lk+='</div>';
    h+=card(h3('🔗 全部链接（37个）')+lk);
  }

  el.innerHTML=h;
}
renderTabs();render();
</script>
</body>
</html>
