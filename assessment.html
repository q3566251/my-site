<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精神健康评估工具速查 & 练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#f7f1e8;
    --soft-bg:#f2e7d9;
    --card-bg:#fdf9f4;
    --ink:#3a332b;
    --ink-soft:#6b6255;
    --accent:#a8734a;
    --accent-dark:#8a5c39;
    --border:#e3d5c1;
    --good:#5f8365;
    --tag-bg:#eee0cc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:"Noto Sans SC","Noto Serif SC",serif;
    line-height:1.6;
  }
  header{
    padding:36px 20px 24px;
    text-align:center;
    background:linear-gradient(180deg,var(--soft-bg),var(--page-bg));
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-family:"Noto Serif SC",serif;
    font-size:1.8rem;
    margin:0 0 6px;
    color:var(--accent-dark);
  }
  header p{margin:0;color:var(--ink-soft);font-size:0.95rem;}

  .container{max-width:1000px;margin:0 auto;padding:20px;}

  .toolbar{
    position:sticky;top:0;z-index:10;
    background:var(--page-bg);
    padding:14px 0;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    border-bottom:1px solid var(--border);
  }
  #search{
    flex:1;min-width:200px;
    padding:10px 14px;border-radius:10px;
    border:1px solid var(--border);
    background:var(--card-bg);
    font-size:0.95rem;color:var(--ink);
    font-family:inherit;
  }
  #search:focus{outline:2px solid var(--accent);}
  .mode-btn{
    padding:10px 16px;border-radius:10px;border:1px solid var(--border);
    background:var(--card-bg);color:var(--ink);cursor:pointer;font-family:inherit;font-size:0.9rem;
    transition:.15s;
  }
  .mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .mode-btn:hover{border-color:var(--accent);}

  .cats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}
  .cat-chip{
    padding:6px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--tag-bg);color:var(--ink-soft);cursor:pointer;font-size:0.85rem;
  }
  .cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  section.category{margin-top:28px;}
  section.category h2{
    font-family:"Noto Serif SC",serif;
    font-size:1.2rem;color:var(--accent-dark);
    border-left:4px solid var(--accent);padding-left:10px;margin-bottom:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    user-select:none;
  }
  section.category h2::after{
    content:'▸';font-size:0.85rem;color:var(--ink-soft);
    transition:transform .15s;margin-left:10px;
  }
  section.category.open h2::after{transform:rotate(90deg);}
  section.category h2:hover{color:var(--accent);}
  section.category .grid,
  section.category .overview-list{display:none;}
  section.category.open .grid{display:grid;}
  section.category.open .overview-list{display:grid;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;cursor:pointer;transition:.15s;
  }
  .card:hover{box-shadow:0 4px 14px rgba(138,92,57,0.12);transform:translateY(-2px);}
  .card h3{margin:0 0 4px;font-size:1.02rem;color:var(--accent-dark);}
  .card .cn-name{font-size:0.88rem;color:var(--ink-soft);margin-bottom:8px;}
  .card .desc{font-size:0.88rem;color:var(--ink);}
  .card .case{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
    font-size:0.82rem;color:var(--ink-soft);display:none;
  }
  .card.expanded .case{display:block;}
  .card .case b{color:var(--good);}
  .tool-link{
    display:inline-block;margin-top:8px;font-size:0.78rem;
    color:var(--accent-dark);text-decoration:none;border-bottom:1px dotted var(--accent-dark);
  }
  .tool-link:hover{color:var(--accent);border-bottom-style:solid;}
  .alt-box{
    margin-top:10px;padding:8px 10px;border-radius:8px;
    background:#fbeee0;border:1px solid #e8c9a0;font-size:0.78rem;color:#6b4a26;
  }
  .alt-box b{color:#8a5c1f;}
  .alt-box .tool-link{color:#8a5c1f;border-bottom-color:#8a5c1f;}
  .internalalt-box{
    margin-top:10px;padding:8px 10px;border-radius:8px;
    background:#eef2ea;border:1px solid #cdd9c5;font-size:0.78rem;color:#3f5233;
  }
  .noalt-box{
    margin-top:10px;padding:6px 10px;border-radius:8px;
    background:#f2ede6;border:1px dashed var(--border);font-size:0.76rem;color:var(--ink-soft);
  }
  .verify-badge{
    display:inline-block;font-size:0.7rem;font-weight:700;
    background:#fde2e2;color:#a33a3a;border:1px solid #f0b8b8;
    padding:2px 9px;border-radius:12px;margin-bottom:8px;
  }
  .evidence-line{
    font-size:0.72rem;color:#7a6a55;margin-top:6px;line-height:1.5;
    background:#f7f2ea;border-left:3px solid #d8c5a0;padding:5px 8px;border-radius:4px;
  }

  /* overview 20 items */
  .overview-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media(max-width:640px){.overview-list{grid-template-columns:1fr;}}
  .overview-list li{
    background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;font-size:0.86rem;
  }
  .overview-list li b{color:var(--accent-dark);}

  /* quiz mode */
  #quiz{display:none;text-align:center;padding:30px 0;}
  #quiz.active{display:block;}
  .quiz-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
    padding:28px 24px;max-width:640px;margin:0 auto;
  }
  .quiz-case{font-size:1.02rem;margin-bottom:20px;line-height:1.8;}
  .quiz-answer{
    margin-top:16px;padding:14px;border-radius:10px;background:var(--soft-bg);
    display:none;text-align:left;
  }
  .quiz-answer.show{display:block;}
  .quiz-answer .tool-name{color:var(--accent-dark);font-weight:700;font-size:1.05rem;}
  .quiz-btns{display:flex;gap:12px;justify-content:center;margin-top:18px;}
  .quiz-btns button{
    padding:10px 20px;border-radius:10px;border:1px solid var(--border);
    background:var(--card-bg);cursor:pointer;font-family:inherit;font-size:0.9rem;
  }
  .quiz-btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .quiz-progress{color:var(--ink-soft);font-size:0.8rem;margin-bottom:10px;}

  .hidden{display:none !important;}
  #empty-msg{text-align:center;color:var(--ink-soft);padding:40px 0;display:none;}
  footer{text-align:center;color:var(--ink-soft);font-size:0.8rem;padding:30px 0;}
</style>
</head>
<body>

<header>
  <h1>精神健康评估工具速查表</h1>
  <p>按类别浏览常用评估量表 · 搜索工具名称 · 案例练习模式巩固记忆</p>
</header>

<div class="container">
  <div class="toolbar">
    <input id="search" type="text" placeholder="搜索工具名称、英文缩写或用途...">
    <button class="mode-btn active" id="browseBtn" onclick="setMode('browse')">浏览模式</button>
    <button class="mode-btn" id="quizBtn" onclick="setMode('quiz')">案例练习模式</button>
  </div>

  <div id="browseView">
    <div class="cats" id="catChips"></div>

    <section class="category" id="overviewSection">
      <h2>评估维度总览（前20项）</h2>
      <ul class="overview-list" id="overviewList"></ul>
    </section>

    <div id="categoriesContainer"></div>
    <div id="empty-msg">没有找到匹配的工具</div>
  </div>

  <div id="quiz">
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="quiz-card">
      <div class="quiz-case" id="quizCase"></div>
      <div class="quiz-answer" id="quizAnswer">
        <div class="tool-name" id="quizToolName"></div>
        <div id="quizReason" style="margin-top:6px;font-size:0.9rem;color:var(--ink-soft);"></div>
        <div id="quizLink" style="margin-top:8px;"></div>
      </div>
      <div class="quiz-btns">
        <button onclick="revealAnswer()">显示答案</button>
        <button class="primary" onclick="nextQuiz()">下一题 →</button>
      </div>
    </div>
  </div>
</div>

<footer>Rendr 临床工具 · 仅供学习参考</footer>

<script>
const overview20 = [
"病史采集：了解个人背景、既往病史和家族史",

"自我评估：患者自评心理健康状况和需求",

"心理教育评估：评估对精神健康问题的理解和知识",
"应对策略评估：评估应对压力和困难的策略技能",
"家庭评估：评估家庭环境对精神健康的影响",
"康复评估：评估康复过程中的进展和需求"

const categories = [
{
  name:"综合心理治疗评估",
  tools:[
    {en:"OSRS", cn:"Outcome and Session Rating Scale", desc:"客观评估心理治疗的进展和效果", case:"治疗师想客观追踪来访者的治疗进展和会谈效果", link:"https://www.scottdmiller.com/performance-metrics"},
    {en:"DAS", cn:"Dyadic Adjustment Scale", desc:"评估亲密伴侣关系满意度的自评问卷", case:"一对伴侣来访，想评估婚姻/亲密关系的满意度"},
    {en:"BSI", cn:"Brief Symptom Inventory", desc:"简短自评，快速全面筛查当下症状困扰程度", case:"患者症状广泛（抑郁、焦虑、敌意、躯体化），需要快速全面筛查", internalAlt:"本站已收录的 DASS-42 + DSM-5跨切面症状量表 组合可替代广泛症状快筛"},
    {en:"Working Alliance Inventory", cn:"工作联盟量表", desc:"评估治疗师与来访者之间的治疗联盟", case:"想了解治疗关系质量是否影响疗效", link:"https://wai.profhorvath.com/"},
    {en:"CORE-OM", cn:"Clinical Outcomes in Routine Evaluation", desc:"评估心理健康困扰和幸福感", case:"常规评估心理治疗结局", link:"https://www.coresystemtrust.org.uk/"},
    {en:"QOLI", cn:"Quality of Life Inventory", desc:"评估个人生活质量", case:"想全面了解来访者的生活满意度", alt:{name:"WHOQOL-BREF", cn:"世界卫生组织生活质量量表", link:"https://www.who.int/tools/whoqol/whoqol-bref"}},
    {en:"SDS", cn:"Sheehan Disability Scale", desc:"3题功能损害自评（工作/社交/家庭）", case:"想用最简短的量表评估症状对功能的整体影响", needsVerification:true, evidence:"核实结果：SDS并非免费工具，官网harmresearch.org明确写明需付费购买/授权（含水印预览版），未找到免费公开版"}
  ]
},
{
  name:"抑郁评估",

    {en:"BDI-II", cn:"Beck Depression Inventory", desc:"成人自评抑郁严重程度", case:"30岁成人患者自我报告长期情绪低落，想自评抑郁水平", alt:{name:"CES-D", cn:"流调中心抑郁量表", link:"https://cesd-r.com/"}},
    {en:"HAM-D", cn:"Hamilton Rating Scale for Depression", desc:"临床评估抑郁严重程度，金标准", case:"精神科医生想客观量化抑郁症状严重程度以追踪药效", link:"https://integrationacademy.ahrq.gov/sites/default/files/2020-07/HDRS.pdf"},
    {en:"GDS", cn:"Geriatric Depression Scale", desc:"老年人抑郁筛查", case:"70岁老人，家属怀疑其有抑郁症，需排除正常老化", link:"https://web.stanford.edu/~yesavage/GDS.html"},
    {en:"CDI", cn:"Children's Depression Inventory", desc:"儿童和青少年抑郁评估", case:"12岁儿童在学校情绪低落，老师建议评估抑郁", internalAlt:"本站已收录的 RCADS（含儿童抑郁分量表）可替代"},
    {en:"IDS", cn:"Inventory of Depressive Symptomatology", desc:"评估抑郁症状严重程度，适合追踪治疗", case:"医生要跟踪患者抑郁症状变化的严重程度"},
    {en:"PDSS", cn:"Postpartum Depression Screening Scale", desc:"筛查产后抑郁症状", case:"产后女性抱怨情绪低落、无助，需筛查产后抑郁", alt:{name:"EPDS", cn:"爱丁堡产后抑郁量表", link:"https://downloads.aap.org/AAP/PDF/Postnatal%20Depression%20Scale.pdf"}}
  ]
},
{
  name:"焦虑评估",
  tools:[
    {en:"GAD-7", cn:"Generalized Anxiety Disorder-7", desc:"筛查广泛性焦虑症，简短自评", case:"28岁男性，持续担心、难以控制焦虑，需快速筛查GAD", link:"https://www.phqscreeners.com/select-screener"},
    {en:"BAI", cn:"Beck Anxiety Inventory", desc:"自评量表，量化焦虑症状强度", case:"35岁女性自述心慌、紧张、出汗，想测焦虑严重程度", internalAlt:"本站已收录的 GAD-7 可做焦虑严重度快速自评（构念侧重不完全相同）"},
    {en:"HAM-A", cn:"Hamilton Anxiety Rating Scale", desc:"临床访谈评定，焦虑严重程度金标准", case:"精神科医生要量化焦虑症状以追踪药物疗效", link:"https://dcf.psychiatry.ufl.edu/files/2011/05/HAMILTON-ANXIETY.pdf"},

    {en:"PARS", cn:"Pediatric Anxiety Rating Scale", desc:"评估儿童和青少年焦虑症状", case:"10岁儿童过度担心、依赖父母，老师怀疑焦虑障碍", alt:{name:"SCARED", cn:"儿童焦虑相关障碍筛查表", link:"https://www.pediatricbipolar.pitt.edu/clinical-services/clinical-tools"}},
    {en:"RCADS", cn:"Revised Children's Anxiety and Depression Scale", desc:"同时评估儿童焦虑和抑郁症状", case:"12岁儿童出现焦虑+抑郁症状，家长想了解共病情况", link:"https://rcads.ucla.edu/"},
    {en:"DASS-42", cn:"Depression Anxiety Stress Scale", desc:"同时评估抑郁、焦虑和压力，共病评估（42题）", case:"25岁女性表现抑郁+焦虑+高压力，需一次性测共病情况", link:"https://www2.psy.unsw.edu.au/dass/"}

},
{
  name:"躁狂评估",

  ]
},
{
  name:"创伤与压力评估",

    {en:"PCL-5", cn:"PTSD Checklist for DSM-5", desc:"PTSD常用筛查工具，自评", case:"退伍军人出现噩梦、回避、过度警觉，需快速筛查PTSD", link:"https://www.ptsd.va.gov/professional/assessment/adult-sr/ptsd-checklist.asp"},
    {en:"CAPS-5", cn:"Clinician-Administered PTSD Scale", desc:"PTSD诊断金标准，结构化访谈", case:"创伤幸存者需要临床访谈确认PTSD诊断", link:"https://www.ptsd.va.gov/professional/assessment/adult-int/caps.asp"},
    {en:"LEC-5", cn:"Life Events Checklist", desc:"评估是否经历过创伤性事件", case:"医生要确认个体是否经历过创伤事件", link:"https://www.ptsd.va.gov/professional/assessment/te-measures/life_events_checklist.asp"},
    {en:"IES-R", cn:"Impact of Event Scale-Revised", desc:"近期创伤反应量表，灾后评估常用", case:"灾后人群近期有侵入性记忆、回避，想评估短期影响", link:"https://www.ptsd.va.gov/professional/assessment/adult-sr/ies-r.asp"},

// build category chips
const catChips = document.getElementById('catChips');
const allChip = document.createElement('div');
allChip.className='cat-chip active';
allChip.textContent='全部';
allChip.onclick=()=>filterCategory('全部',allChip);
catChips.appendChild(allChip);
categories.forEach(cat=>{
  const chip = document.createElement('div');
  chip.className='cat-chip';
  chip.textContent = cat.name;
  chip.onclick = ()=>filterCategory(cat.name, chip);
  catChips.appendChild(chip);
});

function filterCategory(name, el){
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('section.category').forEach(sec=>{
    if(sec.id==='overviewSection') return;
    const match = (name==='全部' || sec.dataset.name===name);
    sec.style.display = match ? '' : 'none';
    if(name!=='全部' && match) sec.classList.add('open');
  });
  document.getElementById('overviewSection').style.display = (name==='全部') ? '' : 'none';
}

// build category sections
const container = document.getElementById('categoriesContainer');
document.querySelector('#overviewSection h2').onclick = ()=>document.getElementById('overviewSection').classList.toggle('open');
categories.forEach(cat=>{
  const sec = document.createElement('section');
  sec.className='category';
  sec.dataset.name = cat.name;
  sec.innerHTML = `<h2>${cat.name}</h2><div class="grid"></div>`;
  sec.querySelector('h2').onclick = ()=>sec.classList.toggle('open');
  const grid = sec.querySelector('.grid');
  cat.tools.forEach(tool=>{
    const card = document.createElement('div');
    card.className='card';
    card.dataset.search = (tool.en+' '+tool.cn+' '+tool.desc+' '+tool.case).toLowerCase();
    let extra = '';
    if(tool.link){
      extra = `<a class="tool-link" href="${tool.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 官方/工具网站</a>`;
    } else if(tool.alt){
      extra = `<div class="alt-box">⚠️ 该工具本身无免费公开版（版权工具）。可用免费<b>替代工具</b>：${tool.alt.name}${tool.alt.cn?'（'+tool.alt.cn+'）':''}${tool.alt.link?`<br><a class="tool-link" href="${tool.alt.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 替代工具官网</a>`:''}</div>`;
    } else if(tool.internalAlt){
      extra = `<div class="internalalt-box">💡 ${tool.internalAlt}</div>`;
    } else if(tool.noCopyright){
      extra = `<div class="noalt-box">ℹ️ 非版权量表/临床技术，可自由使用，无需替代</div>`;
    } else {
      extra = `<div class="noalt-box">未找到免费版本或已验证的免费替代工具（多为Pearson/PAR/MHS等商业出版商版权测验）</div>`;
    }
    const verifyBadge = tool.needsVerification ? `<div class="verify-badge">⚠️ 新增·需要额外验证</div>` : '';
    const evidenceLine = tool.evidence ? `<div class="evidence-line">📎 证据：${tool.evidence}</div>` : '';
    card.innerHTML = `
      ${verifyBadge}
      <h3>${tool.en}</h3>
      <div class="cn-name">${tool.cn}</div>
      <div class="desc">${tool.desc}</div>
      ${extra}
      ${evidenceLine}
      <div class="case"><b>典型案例：</b>${tool.case}</div>
    `;
    card.onclick = ()=>card.classList.toggle('expanded');
    grid.appendChild(card);
  });
  container.appendChild(sec);
});

// search
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.card').forEach(card=>{
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  document.querySelectorAll('section.category').forEach(sec=>{
    if(sec.id==='overviewSection'){
      sec.style.display = q ? 'none' : '';
      return;
    }
    const visibleCards = sec.querySelectorAll('.card:not([style*="display: none"])');
    const hasMatch = visibleCards.length>0;
    sec.style.display = (q && !hasMatch) ? 'none' : '';
    if(q && hasMatch) sec.classList.add('open');
  });
  document.getElementById('empty-msg').style.display = (q && !anyVisible) ? '' : 'none';
  if(q){
    document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
    catChips.firstChild.classList.add('active');
  }
});

let quizIndex = 0;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function setMode(mode){
  const browseBtn = document.getElementById('browseBtn');
  const quizBtn = document.getElementById('quizBtn');
  const browseView = document.getElementById('browseView');
  const quizView = document.getElementById('quiz');
  if(mode==='browse'){
    browseBtn.classList.add('active'); quizBtn.classList.remove('active');
    browseView.style.display=''; quizView.classList.remove('active');
  } else {
    quizBtn.classList.add('active'); browseBtn.classList.remove('active');
    browseView.style.display='none'; quizView.classList.add('active');
    if(quizOrder.length===0){
      quizOrder = shuffle([...Array(quizPool.length).keys()]);
      quizIndex = 0;
      renderQuiz();
    }
  }
}

function renderQuiz(){
  if(quizIndex >= quizOrder.length){
    quizOrder = shuffle([...Array(quizPool.length).keys()]);
    quizIndex = 0;
  }
  const item = quizPool[quizOrder[quizIndex]];
  document.getElementById('quizProgress').textContent = `第 ${quizIndex+1} / ${quizPool.length} 题 · 类别：${item.category}`;
  document.getElementById('quizCase').textContent = '案例：' + item.case;
  document.getElementById('quizToolName').textContent = `${item.en}（${item.cn}）${item.needsVerification?' ⚠️新增·需验证':''}`;
  document.getElementById('quizReason').textContent = item.desc;
  let qLink = '';
  if(item.link){
    qLink = `<a class="tool-link" href="${item.link}" target="_blank" rel="noopener noreferrer">🔗 官方/工具网站</a>`;
  } else if(item.alt){
    qLink = `<div class="alt-box">⚠️ 无免费公开版，可用替代：${item.alt.name}${item.alt.cn?'（'+item.alt.cn+'）':''}${item.alt.link?`<br><a class="tool-link" href="${item.alt.link}" target="_blank" rel="noopener noreferrer">🔗 替代工具官网</a>`:''}</div>`;
  } else if(item.internalAlt){
    qLink = `<div class="internalalt-box">💡 ${item.internalAlt}</div>`;
  } else if(item.noCopyright){
    qLink = `<div class="noalt-box">ℹ️ 非版权量表/临床技术，无需替代</div>`;
  } else {
    qLink = `<div class="noalt-box">未找到免费版本或已验证的替代工具</div>`;
  }
  if(item.evidence) qLink += `<div class="evidence-line">📎 证据：${item.evidence}</div>`;
  document.getElementById('quizLink').innerHTML = qLink;
  document.getElementById('quizAnswer').classList.remove('show');
}

function revealAnswer(){
  document.getElementById('quizAnswer').classList.add('show');
}

function nextQuiz(){
  quizIndex++;
  renderQuiz();
}
</script>
</body>
</html>
