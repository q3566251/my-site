function ord(n){ const s=["th","st","nd","rd"]; const v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
/* 给两个路口点 + 两侧规则(label/weekday/start/end)，算出两条偏移线和标签点。
   CCW（逆时针那一侧）固定对应 specs[0]，CW 对应 specs[1] —— 全文统一，不用每条街重新判断方向 */
function buildSides(ptA, ptB, specs, LINE_OFF, LABEL_OFF){
  LINE_OFF = LINE_OFF||5.5; LABEL_OFF = LABEL_OFF||16;
  const latRef=(ptA[0]+ptB[0])/2, mLat=111320, mLng=111320*Math.cos(latRef*Math.PI/180);
  const toXY=p=>({x:p[1]*mLng,y:p[0]*mLat}), toLL=xy=>[+(xy.y/mLat).toFixed(7),+(xy.x/mLng).toFixed(7)];
  const a=toXY(ptA), b=toXY(ptB);
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/len, uy=dy/len;
  const dirCCW={x:-uy,y:ux}, dirCW={x:uy,y:-ux};
  const midX=(a.x+b.x)/2, midY=(a.y+b.y)/2;
  const line=(dir,off)=>[toLL({x:a.x+dir.x*off,y:a.y+dir.y*off}), toLL({x:b.x+dir.x*off,y:b.y+dir.y*off})];
  const anchor=(dir,off)=>toLL({x:midX+dir.x*off,y:midY+dir.y*off});
  return [
    {label:specs[0].label, weekday:specs[0].weekday, start:specs[0].start, end:specs[0].end, line:line(dirCCW,LINE_OFF), anchor:anchor(dirCCW,LABEL_OFF)},
    {label:specs[1].label, weekday:specs[1].weekday, start:specs[1].start, end:specs[1].end, line:line(dirCW,LINE_OFF),  anchor:anchor(dirCW,LABEL_OFF)}
  ];
}

function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function localISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
/* side.weekday 平时是单个数字；像"周一到周五"这种，写成数组 [1,2,3,4,5] 也支持 */
function matchesDay(side, dow){
  return Array.isArray(side.weekday) ? side.weekday.includes(dow) : side.weekday===dow;
}
function dayLabel(side){
  if (!Array.isArray(side.weekday)) return weekdayCN[side.weekday];
  const d = side.weekday;
  const contiguous = d.length>1 && d.every((v,i)=> i===0 || v===d[i-1]+1);
  return contiguous ? `${weekdayCN[d[0]]}–${weekdayCN[d[d.length-1]]}` : d.map(v=>weekdayCN[v]).join('、');
}
function sideState(side, dow, nowMin){
  if (!matchesDay(side, dow)) return null;
  const s=toMinutes(side.start), e=toMinutes(side.end);
  if (nowMin<s) return 'before';
  if (nowMin<e) return 'active';
  return 'after';
}
/* 星期选择器：选中的星期是否排这一侧，本身跟「现在几点」无关（点周四，所有周四排班的线一起变黄）。
   单日的（一周就一次，比如周四）：红色只留给「今天 + 10点结束」这一种，过了10点才变红＝可以去占；
   11点/13点结束的，就算过了自己的结束时间，今天选中也还是黄色，不变红。
   多日的（周一到周五这种每天都重复的）：不用等"今天过了几点"，选中就是红——这种不是"一周一次"，
   本身大部分时间都能停，直接红更符合实际 */
function previewColor(side, dow, isToday, nowMin){
  if (!matchesDay(side, dow)) return {hex:'#4c7a52'};
  if (Array.isArray(side.weekday)) return {hex:'#b3341f'};
  if (isToday && side.end === '10:00' && nowMin >= toMinutes(side.end)) return {hex:'#b3341f'};
  return {hex:'#e0a521'};
}

const center = [40.635686, -74.011048];

  html:'<div style="width:16px;height:16px;border-radius:50%;background:#a5402c;border:3px solid #fff;box-shadow:0 0 0 5px rgba(165,64,44,.25),0 2px 6px rgba(0,0,0,.35);"></div>',
  iconSize:[16,16], iconAnchor:[8,8]
});
L.marker(center, {icon:mainIcon}).addTo(map).bindPopup('<b>749 61st St</b><br>Rendr');

const HomeControl = L.Control.extend({
  options:{position:'topright'},
  onAdd:function(){
    const btn = L.DomUtil.create('button','map-home-btn');
    btn.type='button'; btn.innerHTML='⌂ 回到 Rendr';
    L.DomEvent.on(btn,'click',function(e){ L.DomEvent.stop(e); map.setView(center,18); });

map.addControl(new HomeControl());

blocks.forEach(block=>{
  block.sides.forEach(side=>{
    side.layer = L.polyline(side.line, {color:'#4c7a52', weight:7, opacity:0.9, lineCap:'round'}).addTo(map);
  });

let searchMarker = null;

/* ---------------- 面板折叠 ---------------- */
let panelOpen = true;
function togglePanel(){
  panelOpen = !panelOpen;
  document.getElementById('panel-body').style.display = panelOpen ? 'block' : 'none';
  document.getElementById('toggle-icon').textContent = panelOpen ? '▲' : '▼';
}

/* ---------------- 星期选择器 ---------------- */
let selectedDow = new Date().getDay();
function buildDayRow(){
  const row = document.getElementById('day-row');
  row.innerHTML = '';
  const todayDow = new Date().getDay();
  dayOrder.forEach(dow=>{
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (dow===todayDow?' today':'') + (dow===selectedDow?' sel':'');
    btn.textContent = weekdayCN[dow][1];
    btn.onclick = ()=>{ selectedDow = dow; refreshAll(); };
    row.appendChild(btn);
  });
}

/* ---------------- 总刷新：实时状态条（跨所有街区找最紧急的）+ 地图每一侧配色 ---------------- */
function refreshAll(){
  const now = new Date();
  const todayDow = now.getDay();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const todayISO = localISO(now);
  const holidaySuspended = holidays2026.includes(todayISO);
  const dateLabel = `${now.getMonth()+1}月${now.getDate()}日 · ${weekdayCN[todayDow]}`;

  /* 实时状态条：扫一遍所有街区/两侧，找「现在」最紧急的一条（进行中 > 稍后 > 都没有） */
  let urgent = null; // {cls, block, side}
  blocks.forEach(block=>{
    block.sides.forEach(side=>{
      const st = sideState(side, todayDow, nowMin);
      if (st==='active' && (!urgent || urgent.cls!=='warn')) urgent = {cls:'warn', block, side, st};
      if (st==='before' && !urgent) urgent = {cls:'amber', block, side, st};
    });
  });
  const liveEl = document.getElementById('live-line');
  if (holidaySuspended){
    liveEl.className = 'live-line ok';
    liveEl.textContent = `现在（${dateLabel}）全市暂停扫街，都能停`;
  } else if (urgent){
    liveEl.className = 'live-line ' + urgent.cls;
    const verb = urgent.st==='active' ? '正在扫街，别停' : '今天稍后扫街';
    liveEl.textContent = `现在（${dateLabel}）· ${urgent.block.name} ${urgent.side.label}：${verb} ${urgent.side.start}–${urgent.side.end}`;
  } else {
    liveEl.className = 'live-line ok';
    liveEl.textContent = `现在（${dateLabel}）都能停`;
  }

  /* 地图每一侧：颜色跟星期选择器走；如果选的正好是今天且这一侧已经过了结束时间，变红＝可以去占了 */
  const isToday = selectedDow === todayDow;
  blocks.forEach(block=>{
    block.sides.forEach(side=>{
      const v = previewColor(side, selectedDow, isToday, nowMin);
      side.layer.setStyle({color:v.hex});
      side.layer.unbindTooltip().bindTooltip(
        `<b>${side.label}</b><br>${dayLabel(side)} ${side.start}–${side.end}`,
        {permanent:true, direction:'top', className:'side-tooltip', offset:[0,-6]}
      ).openTooltip(side.anchor);
    });
  });

  buildDayRow();
}
refreshAll();
setInterval(refreshAll, 60000); // 每分钟自动刷新实时状态

/* ---------------- 地址搜索（OpenStreetMap Nominatim，免费无需 key）---------------- */
async function doSearch(){
  const input = document.getElementById('geo-search');
  const msg = document.getElementById('search-msg');
  const q = input.value.trim();
  if(!q){ return; }
  msg.textContent = '搜索中…';
  try{
    const viewbox = `${DATA_BOUNDS[0][1]},${DATA_BOUNDS[1][0]},${DATA_BOUNDS[1][1]},${DATA_BOUNDS[0][0]}`;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=${viewbox}&bounded=1&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(data && data.length){
      const {lat, lon, display_name} = data[0];
      map.setView([+lat, +lon], 17);
      if(searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker([+lat, +lon]).addTo(map).bindPopup(display_name).openPopup();
      msg.textContent = '';
    } else {
      msg.textContent = '这个范围内没找到，换个说法试试。';
    }
  } catch(e){
    msg.textContent = '搜索失败，检查一下网络。';
  }
}
</script>
